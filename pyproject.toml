[project]
name = "spend-analyser-project"
version = "0.1.0"
description = "Creates a day to day Expense Management system for efficient spends tracking"
readme = "README.md"
authors = [
    { name = "RaghuVamshi-git-pro", email = "vamshikurlagunda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
spend-analyser-project = "spend_analyser_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
